# The slurmech profile: it names the login host and the account in your own
# slurmech configuration, and scripts/slurm_campaign.py reads it from here.
profile = "mimarsinan"

[sync]
include = [
  "run.py",
  "src/**",
  "nevresim/**",
  "hw/**",
  "scripts/**",
  "tests/**",
  "templates/**",
  "test_configs/**",
  "third_party/**",
  "pyproject.toml",
  "uv.lock",
  "Makefile",
  "requirements.txt",
  "pytest.ini",
  "datasets/MNIST/**",
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  ".git/**",
  "env/**",
  "generated/**",
  "runs/**",
  "data/**",
  "**/*.pt",
  "**/*.pth",
]

[slurm]
partition = "gpu"
time = "02:00:00"
gres = "gpu:1"
mem = "200G"
cpus_per_gpu = 40
nodes = 1

# The runtime env: a virtual environment on the remote host that already holds
# the declared dependencies. Build it once, inside the synced project root:
#   uv sync --extra dev --extra loihi   (add --extra sanafe for the GPL backend)
# and point `venv` at it (.venv there), or drop this block entirely: slurmech
# runs `uv sync` itself when a pyproject.toml is present.
[env]
mode = "reuse"
venv = ".venv"

[pack]
parallelism = 1
fail_fast = true
kill_on_failure = true
