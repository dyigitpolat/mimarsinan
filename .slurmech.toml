profile = "mimarsinan-xlog1"

[sync]
include = [
  "run.py",
  "src/**",
  "nevresim/**",
  "hw/**",
  "scripts/**",
  "tests/**",
  "templates/**",
  "test_configs/**",
  "third_party/**",
  "pyproject.toml",
  "uv.lock",
  "Makefile",
  "requirements.txt",
  "pytest.ini",
  "datasets/MNIST/**",
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  ".git/**",
  "env/**",
  "generated/**",
  "runs/**",
  "data/**",
  "**/*.pt",
  "**/*.pth",
]

[slurm]
partition = "gpu"
time = "02:00:00"
gres = "gpu:h100-47:1"
mem = "200G"
cpus_per_gpu = 40
nodes = 1

# The de-facto runtime env (the old mimarsinan_slurmech venv was relocated and
# its activate no longer takes effect; jobs were already running on this one).
# Reuse stays the default while that venv is hand-built. It now needs the
# declared dependencies rather than the synced submodule trees -- run once on
# the remote host, inside the synced project root:
#   uv sync --extra dev --extra loihi   (add --extra sanafe for the GPL backend)
# and point `venv` at .venv, or drop this block entirely: slurmech runs
# `uv sync` itself when a pyproject.toml is present.
[env]
mode = "reuse"
venv = "/home/y/yigit/imagenetshaq/env"

[pack]
parallelism = 1
fail_fast = true
kill_on_failure = true
