# v++ link configuration for the ODIN RTL kernel on the U55C XDMA shell.
#
# One compute unit: the kernel already instantiates NC ODIN cores internally,
# so replicating the CU would replicate the whole crossbar array as well.
# Both the program/stimulus buffers and the capture buffer live in HBM bank 0;
# the payloads are megabytes, not gigabytes, and keeping them on one bank keeps
# the AXI master's address decode trivial for bring-up (P7b may split them).

[connectivity]
nk=odin_fpga_kernel_top:1:odin_0
sp=odin_0.m_axi_gmem:HBM[0]

[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true

# The platform's default kernel clock is 300 MHz; this design's program-RAM
# cascade routes comfortably at the 100 MHz the plan always targeted —
# field-observed 2026-08-25: at the default, route_design died at global
# congestion level 7 after 4.5 h.
[clock]
defaultFreqHz=100000000
