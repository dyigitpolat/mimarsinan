# v++ link configuration for the ODIN RTL kernel on the U250 XDMA shell
# (xilinx_u250_gen3x16_xdma_3_1_202020_1, Vitis 2020.2).
#
# The mirror of odin_u55c.cfg, differing in exactly one line that matters: the
# U250 has no HBM, so the kernel's single AXI master lands on DDR bank 0
# instead of HBM bank 0. Everything else is the same decision for the same
# reason — one compute unit, because the kernel already instantiates NC ODIN
# cores internally and replicating the CU would replicate the whole crossbar
# array with it; and both the program/stimulus buffers and the capture buffer
# on ONE bank, because the payloads are megabytes, not gigabytes, and a single
# bank keeps the master's address decode trivial for bring-up.
#
# PORT NAMES ARE THE RTL'S, NOT A GUESS. hw/fpga/kernel/odin_fpga_kernel_top.v
# declares exactly one master, m_axi_gmem (lines 88-112), and one slave,
# s_axi_control (lines 68-85); scripts/hacc/gen_kernel_xml.py declares the same
# two ports to Vitis. `sp=` names the master only — v++ connects the slave
# control port itself.
#
# WHY THIS CARD AT ALL: the U55C shell on this cluster is locked to Vitis
# 2022.2, which is not installed (see scripts/hacc/cards.sh). U250 + 2020.2 is
# the pairing HACC@NUS can actually build today.

[connectivity]
nk=odin_fpga_kernel_top:1:odin_0
sp=odin_0.m_axi_gmem:DDR[0]

[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true

# The platform's default kernel clock is 300 MHz; this design's program-RAM
# cascade routes comfortably at the 100 MHz the plan always targeted —
# field-observed 2026-08-25: at the default, route_design died at global
# congestion level 7 after 4.5 h.
[clock]
defaultFreqHz=100000000
